<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
  <main class="card">
    <img src="assets/images/illustration-article.svg" alt="" class="card-image">

    <div class="content">
      <span class="btn">Learning</span>

      <p class="date">Published 21 Dec 2023</p>
      <h1 class="title">HTML & CSS foundations</h1>
      <p class="desc">These languages are the backbone of every website, defining structure, content, and presentation.</p>

      <div class="name">
        <img src="./assets/images/image-avatar.webp" alt="" class="avatar">
        <h4>Greg Hooper</h4>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/battleshopventureswaqas-blip">Waqas</a>.
  </footer>
</body>
</html>
